<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
  <meta name="theme-color" content="#0B2545">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المستشار القانوني">
  <title>المستشار القانوني | Full Speed</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ نظام التصميم — غيّر الألوان من هنا فقط ============ */
:root {
  --brand: #0B2545;        /* كحلي أساسي */
  --brand-2: #13396B;
  --brand-soft: #E8EEF7;
  --accent: #FF6B1A;       /* برتقالي السرعة */
  --accent-soft: #FFF1E8;
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --ink: #0F1B2D;
  --ink-2: #334155;
  --muted: #6B7A90;
  --line: #E2E8F0;
  --ok: #138A4B;  --ok-bg: #E7F6EE;
  --warn: #A15C00; --warn-bg: #FFF4E0;
  --bad: #C0262D;  --bad-bg: #FDECEC;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(15, 27, 45, .05), 0 4px 16px rgba(15, 27, 45, .06);
  --shadow-lg: 0 18px 50px rgba(11, 37, 69, .18);
  --sidebar: 264px;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #7FB2F0; --brand-2: #A9CBF5; --brand-soft: #16263B;
    --accent: #FF8A45; --accent-soft: #3A2414;
    --bg: #0B1220; --surface: #121B2B; --surface-2: #0F1726;
    --ink: #E7EDF5; --ink-2: #C3CFDD; --muted: #8DA0B8; --line: #22324A;
    --ok: #5FD394; --ok-bg: #12301F; --warn: #F5B95F; --warn-bg: #33260F; --bad: #FF8A84; --bad-bg: #3A1716;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 18px 50px rgba(0,0,0,.5);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.75;
       -webkit-font-smoothing: antialiased; }
a { color: var(--brand-2); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.4; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ============ الشعار ============ */
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), #FF9A3D);
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(255, 107, 26, .35); flex: none; }
.logo-mark svg { width: 24px; height: 24px; }
.logo-text b { display: block; font-size: 16px; font-weight: 700; letter-spacing: .2px; }
.logo-text span { display: block; font-size: 12px; opacity: .75; margin-top: -3px; }

/* ============ شاشة الدخول ============ */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1.05fr 1fr; }
.auth-hero { background: radial-gradient(1200px 600px at 110% -10%, #1E4F8F 0%, transparent 60%), linear-gradient(160deg, #0B2545, #071A33);
  color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-hero .speed { position: absolute; inset-inline-end: -60px; top: 34%; opacity: .12; pointer-events: none; }
.auth-hero > * { position: relative; }
.auth-hero h1 { font-size: 34px; font-weight: 700; margin: 28px 0 10px; }
.auth-hero p { color: #C9D6E8; max-width: 440px; margin: 0; }
.auth-points { display: grid; gap: 12px; margin-top: 28px; }
.auth-points div { display: flex; gap: 10px; align-items: center; color: #DCE6F3; }
.auth-points svg { color: var(--accent); }
.auth-form { display: grid; place-items: center; padding: 32px 20px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h2 { font-size: 24px; margin-bottom: 4px; }
.auth-card .sub { color: var(--muted); margin-bottom: 22px; }
@media (max-width: 860px) {
  .auth { grid-template-columns: 1fr; }
  .auth-hero { padding: 28px 20px 30px; }
  .auth-hero h1 { font-size: 24px; margin-top: 18px; }
  .auth-points, .auth-hero .speed { display: none; }
  .auth-form { padding: 24px 16px 40px; align-items: start; }
}

/* ============ هيكل التطبيق ============ */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { background: linear-gradient(180deg, #0B2545, #0A1F3B); color: #DCE6F3; padding: 20px 14px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 22px; }
.sidebar .logo-text b { color: #fff; }
.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: #C9D6E8; font-weight: 500; cursor: pointer; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.active { background: rgba(255, 107, 26, .16); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav a.active svg { color: var(--accent); }
.side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.1); padding-top: 14px; display: grid; gap: 8px; }
.me { display: flex; gap: 10px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.me b { display: block; color: #fff; font-size: 14px; }
.me span { font-size: 12px; color: #9FB3CC; }
.side-foot a { color: #9FB3CC; display: flex; gap: 10px; align-items: center; padding: 6px 4px; cursor: pointer; font-size: 14px; }
.side-foot a:hover { color: #fff; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-size: 19px; font-weight: 700; }
.topbar .crumb { color: var(--muted); font-size: 13px; }
.topbar .mob-logo { display: none; }
.content { max-width: 1040px; margin: 0 auto; padding: 24px 28px 60px; }

.bottomnav { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { padding: 10px 16px; background: #0B2545; color: #fff; border-bottom: none; }
  .topbar .mob-logo { display: flex; }
  .topbar .title-wrap { display: none; }
  .topbar .mob-logo .logo-mark { width: 32px; height: 32px; border-radius: 9px; }
  .topbar .mob-logo .logo-text b { font-size: 14px; color: #fff; }
  .topbar .mob-logo .logo-text span { color: #C9D6E8; }
  .content { padding: 16px 16px 96px; }
  .page-title { display: block !important; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; inset-inline: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; cursor: pointer; font-weight: 500; }
  .bottomnav a.active { color: var(--accent); }
  .bottomnav svg.i { width: 22px; height: 22px; }
}
.page-title { display: none; font-size: 20px; font-weight: 700; margin-bottom: 12px; }

/* ============ عناصر عامة ============ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.card-head .spacer { flex: 1; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

label.lbl { display: block; font-weight: 600; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.field { margin-bottom: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.input, select.input, textarea.input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px;
  transition: border-color .15s, box-shadow .15s; outline: none; }
.input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-2) 18%, transparent); }
textarea.input { resize: vertical; min-height: 110px; line-height: 1.7; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: var(--radius-sm);
  padding: 11px 18px; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff; transition: transform .05s, filter .15s; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .btn { background: #2563A8; } }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.accent { background: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.block { width: 100%; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.tabs-scroll { overflow-x: auto; scrollbar-width: none; }
.tabs-scroll .seg { flex-wrap: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.b-info { background: var(--brand-soft); color: var(--brand); }
.b-accent { background: var(--accent-soft); color: var(--accent); }

.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 14px; }
.alert svg { margin-top: 3px; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.alert.info { background: var(--brand-soft); color: var(--brand); }

.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--brand);
  border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; cursor: pointer; margin: 2px; }
.chip:hover { border-color: var(--brand-2); }
.chip.sugg { color: var(--ink-2); font-weight: 500; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-size: 12px; font-weight: 600; }
.tw { overflow-x: auto; }

.kpi { padding: 16px 18px; }
.kpi .v { font-size: 26px; font-weight: 700; }
.kpi .l { color: var(--muted); font-size: 13px; }

.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* ============ صفحة السؤال ============ */
.ask-hero { background: linear-gradient(135deg, #0B2545 0%, #13396B 100%); color: #fff; border: none; }
.ask-hero h2 { font-size: 20px; color: #fff; }
.ask-hero .muted { color: #C9D6E8; }
.ask-hero .seg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
.ask-hero .seg button { color: #C9D6E8; }
.ask-hero .seg button.on { background: #fff; color: var(--brand); }
@media (prefers-color-scheme: dark) { .ask-hero .seg button.on { color: #0B2545; } }
.ask-hero textarea.input { background: #fff; color: #0F1B2D; border: none; margin-top: 12px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; background: rgba(255, 107, 26, .14); color: #FFD9C2; border-radius: 10px;
  padding: 9px 12px; font-size: 13px; margin-top: 12px; }
.privacy svg { color: var(--accent); margin-top: 2px; }
.suggs { margin-top: 10px; }
.ask-hero .chip.sugg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); color: #E3ECF7; }

.answer .q { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.answer .summary { font-size: 16.5px; font-weight: 600; margin: 10px 0 4px; }
.sec { margin-top: 20px; }
.sec-t { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--brand); font-size: 15px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.sec-t .n { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; }
.quote { background: var(--surface-2); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 10px; white-space: pre-line; }
.quote .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.quote .why { color: var(--muted); font-size: 13px; margin-top: 6px; }
.md p { margin: 4px 0; }
.md ul { margin: 4px 0; padding-inline-start: 20px; }
.md li { margin: 3px 0; }
.examples { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.example { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.example h4 { font-size: 14px; margin-bottom: 4px; }
.example .out { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; }
.feedback { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px; }

.skeleton { display: grid; gap: 10px; }
.skeleton div { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line), var(--surface-2), var(--line)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.loading-line { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-bottom: 12px; }
.spin { width: 18px; height: 18px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ الجزاءات ============ */
.vlist { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
.vitem { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
.vitem:last-child { border-bottom: none; }
.vitem:hover { background: var(--surface-2); }
.vitem.on { background: var(--accent-soft); }
.vitem .no { font-weight: 700; color: var(--accent); min-width: 28px; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.levels div { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; font-size: 13px; background: var(--surface-2); }
.levels div b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.levels div.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.result-big { font-size: 20px; font-weight: 700; color: var(--accent); }
details.more { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin: 10px 0 16px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--brand); }
ol.steps { padding-inline-start: 20px; margin: 0; }
ol.steps li { margin: 4px 0; }
@media (max-width: 600px) { .levels { grid-template-columns: repeat(2, 1fr); } }

/* ============ القوانين ============ */
.src-card { cursor: pointer; transition: border-color .15s, transform .1s; }
.src-card:hover { border-color: var(--brand-2); transform: translateY(-1px); }
.art { padding: 14px 0; border-bottom: 1px solid var(--line); }
.art h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.art .ch { color: var(--muted); font-size: 12px; font-weight: 500; }
.art .tx { white-space: pre-line; color: var(--ink-2); margin-top: 6px; }

/* ============ توقيع المطوّر ============ */
.credit { font-size: 12px; color: #9FB3CC; margin-top: 10px; direction: ltr; display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.auth-hero .credit { align-items: flex-end; }
.credit b { color: #fff; font-weight: 600; }
.credit a { color: var(--accent); }
.side-foot .credit { margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
.page-credit { display: none; }
@media (max-width: 900px) {
  .page-credit { display: block; text-align: center; padding: 18px 0 4px; }
  .page-credit .credit { color: var(--muted); }
  .page-credit .credit b { color: var(--ink-2); }
}

/* ============ نوافذ ============ */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 18, 33, .55); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { font-size: 16px; flex: 1; }
.modal-b { padding: 16px 20px; overflow-y: auto; white-space: pre-line; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; }
.x { background: transparent; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 8px; }
.x:hover { background: var(--surface-2); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 600px) {
  .modal-bg { align-items: end; padding: 0; }
  .modal { border-radius: 18px 18px 0 0; max-height: 90vh; }
}
.modal.wide { max-width: 920px; }
.modal.wide .modal-b { white-space: normal; }
.modal.wide .modal-f { justify-content: flex-end; }
.pv { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; display: grid; gap: 8px; background: var(--surface-2); }
.pv .row { gap: 8px; }
.pv textarea { font-size: 14px; }
mark.pii { background: #FFE1CC; color: #8A3300; border-radius: 4px; padding: 0 3px; }

.sheet-menu { display: grid; gap: 4px; padding: 6px; }
.sheet-menu a { display: flex; gap: 12px; align-items: center; padding: 13px 12px; border-radius: 10px; cursor: pointer; color: var(--ink); font-weight: 500; }
.sheet-menu a:hover { background: var(--surface-2); }

.toast { position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translateX(50%); background: #0F1B2D; color: #fff;
  padding: 11px 18px; border-radius: 12px; z-index: 60; box-shadow: var(--shadow-lg); font-size: 14px; max-width: calc(100% - 32px); animation: fade .2s; }
.toast.bad { background: var(--bad); }
@media (max-width: 900px) { .toast { bottom: 90px; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
/* =========================================================================
   المستشار القانوني — واجهة التطبيق (صفحة واحدة)
   ========================================================================= */
(function () {
'use strict';

// ---------------- أدوات ----------------
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// داخل رابط Apps Script نستخدم google.script.run، وفي التطبيق المستقل (GitHub Pages) نكلم doPost
var API_URL = window.FS_API_URL || '';
var IS_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
var IS_APP = !IS_GAS && !!API_URL;

function api(action, data) {
  return new Promise(function (resolve, reject) {
    var req = { action: action, token: state.token, data: data || {} };
    var done = function (res) {
      if (!res) return reject(new Error('لا يوجد رد من الخادم'));
      if (res.ok) return resolve(res.data);
      if (res.auth === false) { logoutLocal(); }
      reject(new Error(res.error || 'حدث خطأ'));
    };
    if (IS_GAS) {
      google.script.run.withSuccessHandler(done)
        .withFailureHandler(function (err) { reject(new Error((err && err.message) || 'تعذر الاتصال بالخادم')); })
        .api(req);
      return;
    }
    if (!API_URL) return reject(new Error('رابط السيرفر غير مضبوط في config.js'));
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 330000);
    // بدون Content-Type حتى لا يرسل المتصفح طلب preflight (Apps Script لا يرد عليه)
    fetch(API_URL, { method: 'POST', body: JSON.stringify(req), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (res) { clearTimeout(timer); done(res); })
      .catch(function (err) {
        clearTimeout(timer);
        reject(new Error(navigator.onLine === false ? 'لا يوجد اتصال بالإنترنت' : 'تعذر الاتصال بالخادم، حاول مرة أخرى'));
      });
  });
}
if (IS_APP && 'serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

function toast(msg, bad) {
  $$('.toast').forEach(function (old) { old.parentNode.removeChild(old); }); // إشعار واحد في كل مرة
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3800);
}

function modal(title, bodyHtml, footHtml) {
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><h3>' + esc(title) + '</h3>' +
    '<button class="x" data-close aria-label="إغلاق">' + ic('x') + '</button></div><div class="modal-b">' + bodyHtml + '</div>' +
    (footHtml ? '<div class="modal-f">' + footHtml + '</div>' : '') + '</div>';
  // النوافذ التي فيها نماذج (data-sticky) لا تُغلق بالضغط خارجها حتى لا يضيع المكتوب
  bg.addEventListener('click', function (e) { if ((e.target === bg && !bg.dataset.sticky) || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

/** يقرأ ملف البيانات من جهاز المستخدم ويرفعه على أجزاء صغيرة. */
function uploadDataFile(file, action, extra, onProgress) {
  return new Promise(function (resolve, reject) {
    if (!file) return reject(new Error('اختر ملف البيانات FullSpeed_Legal_Data.json'));
    if (!/\.json$/i.test(file.name)) return reject(new Error('ملف البيانات يجب أن يكون FullSpeed_Legal_Data.json'));
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('تعذرت قراءة الملف')); };
    reader.onload = function () { uploadChunks(String(reader.result), action, extra, onProgress).then(resolve, reject); };
    reader.readAsText(file, 'utf-8');
  });
}

function md(text) {
  var lines = esc(text).split('\n'), html = '', inList = false;
  lines.forEach(function (line) {
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    var m = line.match(/^\s*(?:[-*•]|\d+[.)-])\s+(.*)$/);
    if (m) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + m[1] + '</li>'; }
    else { if (inList) { html += '</ul>'; inList = false; } if (line.trim()) html += '<p>' + line + '</p>'; }
  });
  if (inList) html += '</ul>';
  return '<div class="md">' + html + '</div>';
}
function alerts(list, cls) {
  return (list || []).map(function (t) { return '<div class="alert ' + cls + '">' + ic(cls === 'info' ? 'info' : 'alert') + '<div>' + esc(t) + '</div></div>'; }).join('');
}

var COMMON_NAMES = ('محمد احمد محمود مصطفى علي ابراهيم عمر خالد ياسر طارق هشام وليد عمرو شريف ايمن اشرف حازم تامر رامي سامح شادي ' +
  'كمال جمال حسام عصام هاني ماجد مجدي ممدوح مدحت نبيل وائل يوسف يحيى زياد عبدالله عبدالرحمن عبدالعزيز عبدالحميد سيد السيد ' +
  'فاطمه مريم ساره سلمى منى مها هبه ياسمين دينا رانيا شيماء ايمان اسماء نهى غاده ريهام نرمين ايه اميره هاله سمر ندى رحاب').split(' ');
var TITLE_RE = /(?:الموظف|الموظفه|الموظفة|العامل|العامله|العاملة|الزميل|الزميله|الزميلة|زميلنا|زميلتنا|الاستاذ|الأستاذ|الاستاذه|الأستاذة|السيد|السيده|السيدة|المهندس|المهندسه|المهندسة|المدعو|المدعوه|المدعوة|اسمه|اسمها|أ\/|ا\/|م\/)\s+([ء-ي]{3,})(?:\s+([ء-ي]{3,}))?/g;
var NOT_NAME = ('غاب تاخر تأخر اتأخر رفض مشي ترك تغيب اتغيب تغيبت غابت عمل بيعمل يعمل كان قام جه جاء اخد أخذ سرق كسر طلب عايز يريد ' +
  'المسؤول المختص الجديد القديم المذكور المخالف الذي اللي التي في من على عن بعد قبل لم لا').split(' ');

function normAr(s) { return s.replace(/[إأآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }

function scanSensitive(text) {
  var hits = [];
  var t = text.replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x660); });
  var rules = [
    ['رقم قومي', /(^|[^\d])([23]\d{13})(?!\d)/g],
    ['رقم هاتف', /(^|[^\d])((?:\+?20|0020)?\s?0?1[0125][\s-]?\d{3,4}[\s-]?\d{4})(?!\d)/g],
    ['بريد إلكتروني', /()([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g],
    ['رقم حساب أو رقم طويل', /(^|[^\d])(\d{10,})(?!\d)/g]
  ];
  rules.forEach(function (r) {
    var m; while ((m = r[1].exec(t))) hits.push({ type: r[0], value: m[2], strong: true });
  });
  var m2;
  while ((m2 = TITLE_RE.exec(text))) {
    var w1 = m2[1], w2 = m2[2] || '';
    if (NOT_NAME.indexOf(normAr(w1)) >= 0 || NOT_NAME.indexOf(w1) >= 0) continue;
    var val = w1 + (w2 && NOT_NAME.indexOf(w2) < 0 ? ' ' + w2 : '');
    hits.push({ type: 'اسم شخص محتمل', value: val, strong: false });
  }
  (text.match(/[ء-ي]{3,}/g) || []).forEach(function (w) {
    if (COMMON_NAMES.indexOf(normAr(w)) >= 0 && !hits.some(function (h) { return h.value.indexOf(w) >= 0; })) {
      hits.push({ type: 'اسم شخص محتمل', value: w, strong: false });
    }
  });
  var seen = {};
  return hits.filter(function (h) { var k = h.type + h.value; if (seen[k]) return false; seen[k] = 1; return true; });
}

function redactText(text, hits) {
  var t = text.replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x660); });
  hits.forEach(function (h) {
    var rep = h.strong ? '[' + h.type + ' محذوف]' : '[اسم]';
    t = t.split(h.value).join(rep);
  });
  return t;
}

function privacyGate(text) {
  return new Promise(function (resolve) {
    var hits = scanSensitive(text);
    if (!hits.length) return resolve(text);
    var marked = esc(text);
    hits.forEach(function (h) { marked = marked.split(esc(h.value)).join('<mark class="pii">' + esc(h.value) + '</mark>'); });
    var onlyNames = hits.every(function (h) { return !h.strong; });
    var m = modal('تنبيه: بيانات شخصية في السؤال',
      '<div class="alert warn">' + ic('shield') + '<div>الأسئلة تُرسل لخدمة Google Gemini المجانية، وقد تستخدم Google ما يُرسل إليها لتحسين خدماتها. ' +
      'لا تُرسل أسماء الموظفين أو أرقامهم القومية أو هواتفهم؛ السؤال يُفهم بنفس الدقة بدونها.</div></div>' +
      '<div class="small muted" style="margin:8px 0 4px">تم العثور على:</div><div>' +
      hits.map(function (h) { return '<span class="badge b-warn" style="margin:2px">' + esc(h.type) + ': ' + esc(h.value) + '</span>'; }).join('') +
      '</div><div class="quote" style="border-inline-start-color:var(--warn);margin-top:12px">' + marked + '</div>',
      '<button class="btn accent" data-a="redact">احذفها وأرسل</button><button class="btn ghost" data-a="edit">تعديل السؤال</button>' +
      (onlyNames ? '<button class="btn ghost" data-a="send">ليست أسماء أشخاص، أرسل</button>' : ''));
    $$('[data-a]', m).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.a; m.remove();
        if (a === 'redact') resolve(redactText(text, hits));
        else if (a === 'send') resolve(text);
        else resolve(null);
      });
    });
    m.addEventListener('click', function (e) { if (e.target === m || e.target.closest('[data-close]')) resolve(null); });
  });
}

var SUGGESTIONS = ['موظف غاب 3 أيام بدون إذن، ما الجزاء وهل يجوز فصله؟', 'ما الحد الأقصى للخصم من الأجر في الشهر؟',
  'كيف يُحسب الأجر الإضافي في يوم الراحة؟', 'موظف كسر لابتوب الشركة، هل نخصم ثمنه من مرتبه؟', 'ما مدة إجازة الوضع للموظفة؟'];

function viewAsk(v) {
  v.innerHTML =
    '<div class="card ask-hero"><div class="row"><h2>اسأل المستشار القانوني</h2><span class="spacer"></span>' +
    '<div class="seg" id="mode"><button class="on" data-m="question">سؤال</button><button data-m="case">حالة عملية</button></div></div>' +
    '<div class="muted small" style="margin-top:6px">الإجابة من النصوص القانونية المتاحة فقط، مع رقم المادة والتحقق الآلي من كل اقتباس.</div>' +
    '<textarea class="input" id="q" rows="4" placeholder="اكتب سؤالك أو الحالة... مثال: موظف في الحسابات تأخر ساعة ونصف للمرة الثانية هذا الشهر، ما الجزاء؟"></textarea>' +
    '<div class="privacy">' + ic('shield') + '<div><b>لا تكتب أسماء أو أرقاماً قومية أو هواتف.</b> اكتب "موظف في المخازن" بدل اسمه؛ البرنامج يحذف الأرقام الحساسة تلقائياً وينبهك للأسماء.</div></div>' +
    '<div class="row" style="margin-top:12px"><label class="small" style="display:flex;gap:6px;align-items:center;color:#C9D6E8;cursor:pointer">' +
    '<input type="checkbox" id="follow"> متابعة على الأسئلة السابقة</label><span class="spacer"></span>' +
    '<button class="btn accent" id="send">' + ic('send') + 'اسأل</button></div>' +
    '<div class="suggs">' + SUGGESTIONS.map(function (s) { return '<span class="chip sugg">' + esc(s) + '</span>'; }).join('') + '</div></div>' +
    '<div id="answers"></div>';
  var mode = 'question';
  $$('#mode button', v).forEach(function (b) {
    b.addEventListener('click', function () { mode = b.dataset.m; $$('#mode button', v).forEach(function (x) { x.classList.toggle('on', x === b); }); });
  });
  $$('.chip.sugg', v).forEach(function (c) { c.addEventListener('click', function () { $('#q').value = c.textContent; $('#q').focus(); }); });
  $('#send').addEventListener('click', function () { submitQuestion(mode); });
  $('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitQuestion(mode); });
  state.session.slice().reverse().forEach(function (r) { $('#answers').insertAdjacentHTML('beforeend', renderAnswer(r)); });
}

function submitQuestion(mode) {
  var raw = $('#q').value.trim();
  if (raw.length < 5) { toast('اكتب السؤال بتفصيل أكثر', true); return; }
  privacyGate(raw).then(function (text) {
    if (text === null) { $('#q').focus(); return; }
    var btn = $('#send'); btn.disabled = true;
    var box = document.createElement('div');
    box.className = 'card';
    box.innerHTML = '<div class="loading-line"><div class="spin"></div>جارٍ مراجعة النصوص القانونية وصياغة الإجابة...</div>' +
      '<div class="skeleton"><div></div><div style="width:85%"></div><div style="width:70%"></div></div>';
    $('#answers').prepend(box);
    var history = $('#follow').checked ? state.session.slice(-3).map(function (r) { return { question: r.question, summary: r.answer.summary }; }) : [];
    api('ask', { question: text, mode: mode, history: history }).then(function (r) {
      state.session.push(r);
      box.outerHTML = renderAnswer(r);
      $('#q').value = '';
    }).catch(function (e) {
      box.innerHTML = '<div class="alert bad">' + ic('alert') + esc(e.message) + '</div>';
    }).then(function () { btn.disabled = false; });
  });
}

var CONF = { explicit: ['نص صريح', 'b-ok'], inferred: ['استنتاج من نصوص عامة', 'b-warn'], needs_lawyer: ['يحتاج مراجعة محامٍ', 'b-bad'] };
var CHECK = { ok: ['الاقتباس مطابق للنص', 'b-ok'], partial: ['مطابق جزئياً', 'b-warn'], mismatch: ['الاقتباس لا يطابق النص', 'b-bad'], missing: ['المادة غير موجودة', 'b-bad'] };

function renderAnswer(r) {
  var a = r.answer, ver = r.verification || { checks: [] };
  var chk = function (s, n, cross) {
    for (var i = 0; i < ver.checks.length; i++) {
      var c = ver.checks[i];
      if (c.source === s && String(c.article) === String(n) && !!c.cross === !!cross) return c;
    }
    return {};
  };
  var conf = CONF[a.confidence] || ['', 'b-info'];
  var h = '<div class="card answer" data-id="' + esc(r.id) + '"><div class="q">' + ic('ask') + ' ' + esc(r.question) + '</div><div class="row">';
  if (r.provider === 'search') h += '<span class="badge b-info">' + ic('search') + 'وضع البحث فقط</span>';
  else h += '<span class="badge ' + conf[1] + '">' + conf[0] + '</span>';
  h += ver.all_ok ? '<span class="badge b-ok">' + ic('check') + 'كل المراجع تم التحقق منها</span>'
                  : '<span class="badge b-bad">' + ic('alert') + ver.problems + ' مرجع لم يتطابق — راجع قبل الاعتماد</span>';
  if (!a.found) h += '<span class="badge b-warn">لا يوجد نص صريح في المراجع المتاحة</span>';
  h += '</div>';
  if (r.notice) h += '<div class="alert warn">' + ic('info') + '<div>' + esc(r.notice) + '</div></div>';
  if (r.redactions && r.redactions.length) h += '<div class="alert info">' + ic('shield') + '<div>تم حذف بيانات حساسة من السؤال تلقائياً قبل إرساله.</div></div>';
  h += '<div class="summary">' + esc(a.summary) + '</div>';

  h += '<div class="sec"><div class="sec-t"><span class="n">1</span>النص القانوني والمادة المرجعية</div>';
  if (!(a.legal_texts || []).length) h += '<div class="muted">لم يُعثر على نص مباشر في المراجع المتاحة.</div>';
  (a.legal_texts || []).forEach(function (t) {
    var c = CHECK[chk(t.source, t.article, false).status] || ['', 'b-info'];
    h += '<div class="quote"><div class="meta">' + refChip(t.source, t.article) + '<span class="badge ' + c[1] + '">' + c[0] + '</span></div>' +
         esc(t.quote) + '<div class="why">' + esc(t.relevance) + '</div></div>';
  });
  h += '</div>';
  if (r.provider !== 'search' || a.explanation) h += '<div class="sec"><div class="sec-t"><span class="n">2</span>التفسير المبسط والتطبيقي</div>' + md(a.explanation) + '</div>';
  if (r.provider !== 'search') {
    h += '<div class="sec"><div class="sec-t"><span class="n">3</span>التقاطع مع القوانين الأخرى</div>';
    if (!(a.cross_law || []).length) h += '<div class="muted">لا يوجد في المراجع المتاحة نص مرتبط مباشرة من القوانين الأخرى.</div>';
    (a.cross_law || []).forEach(function (x) {
      var c = chk(x.source, x.article, true);
      h += '<div style="margin-bottom:8px">' + refChip(x.source, x.article) + (c.status === 'missing' ? '<span class="badge b-bad">غير موجودة</span>' : '') + ' ' + esc(x.note) + '</div>';
    });
    h += '</div><div class="sec"><div class="sec-t"><span class="n">4</span>أمثلة عملية</div><div class="examples">' +
      (a.examples || []).map(function (e) {
        return '<div class="example"><h4>' + esc(e.title) + '</h4><div class="small">' + esc(e.scenario) + '</div><div class="out"><b>النتيجة:</b> ' + esc(e.outcome) + '</div></div>';
      }).join('') + '</div></div>';
  }
  if ((a.clarifying_questions || []).length) {
    h += '<div class="sec"><div class="sec-t">' + ic('info') + 'معلومات تحدد الحكم بدقة</div><ul>' +
      a.clarifying_questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
  }
  if ((a.missing_references || []).length) {
    h += '<div class="alert warn">' + ic('alert') + '<div><b>مراجع غير متاحة يحتاجها هذا السؤال:</b><ul style="margin:4px 0 0">' +
      a.missing_references.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div></div>';
  }
  h += '<div class="feedback"><span class="small muted">هل الإجابة دقيقة؟</span>' +
       '<button class="btn ghost sm" data-fb="good">👍 نعم</button><button class="btn ghost sm" data-fb="bad">👎 بها خطأ</button></div></div>';
  return h;
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-fb]');
  if (!b) return;
  var card = b.closest('.answer'), rating = b.dataset.fb, note = '';
  if (rating === 'bad') note = prompt('ما الخطأ في الإجابة؟ (اختياري — يساعد في التحسين)') || '';
  api('feedback', { id: card.dataset.id, rating: rating, note: note }).then(function () {
    $('.feedback', card).innerHTML = '<span class="badge b-ok">' + ic('check') + 'شكراً، تم تسجيل تقييمك</span>';
  }).catch(function (err) { toast(err.message, true); });
});

function articleEditor(src, art, done) {
  var tabs = art ? [['one', 'تعديل المادة']] : [['one', 'كتابة مادة'], ['paste', 'لصق نص كامل'], ['file', 'صورة أو PDF']];
  var m = modal((art ? 'تعديل ' + art.label : 'إضافة مواد') + ' — ' + src.short,

    '<button class="btn ghost" data-close>إلغاء</button><button class="btn accent" id="esave">حفظ</button>');
  m.querySelector('.modal').classList.add('wide'); m.dataset.sticky = '1';
  var tab = 'one', preview = null;
  var body = $('#eb', m), save = $('#esave', m);

    tab = t; preview = null;

    save.hidden = t !== 'one';

    } else if (t === 'paste') {

        '<div class="hint">البرنامج يقسّمه تلقائياً حسب عناوين المواد مثل "مادة (5)" أو "المادة الخامسة"، ثم تراجعه قبل الحفظ.</div></div>' +
        '<button class="btn" id="esplit">' + ic('check') + 'تقسيم ومراجعة</button><div id="epv"></div>';

function readBase64(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onerror = function () { reject(new Error('تعذرت قراءة الملف')); };
    r.onload = function () { resolve(String(r.result).replace(/^data:[^,]*,/, '')); };
    r.readAsDataURL(file);
  });
}

/** يرفع نصاً طويلاً للخادم على أجزاء (كل جزء 80 ألف حرف) ويعيد عدد الأجزاء. */
function uploadChunks(text, action, extra, onProgress) {
  var size = 80000, total = Math.ceil(text.length / size), i = 0;
  return new Promise(function (resolve, reject) {
    (function next() {
      if (i >= total) return resolve(total);
      var payload = Object.assign({ index: i, total: total, chunk: text.substr(i * size, size) }, extra || {});
      api(action, payload).then(function () { i++; if (onProgress) onProgress(i, total); next(); }).catch(reject);
    })();
  });
}

    keyField('akey2', 'paid', ai.hasPaid, 'المفتاح المدفوع', 'من مشروع مفعّل عليه الفوترة (Billing). أسئلته لا تستخدمها Google، والتكلفة صغيرة جداً.') +
    '<div class="field"><label class="lbl">طريقة الاستخدام</label><select class="input" id="amode">' +
    [['free_first', 'المجاني أولاً ثم المدفوع (موصى به)'], ['paid_only', 'المدفوع فقط (خصوصية أعلى)'], ['free_only', 'المجاني فقط']]

function kpi(label, value) { return '<div class="card kpi"><div class="l">' + esc(label) + '</div><div class="v num">' + esc(value) + '</div></div>'; }

if (state.token) {
  api('auth.me').then(function (u) { state.user = u; if (u.company) window.COMPANY = u.company; renderShell(); }).catch(function () { logoutLocal(); });
} else {
  renderAuth();
