<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="utf-8">
  <meta name="theme-color" content="#F4F6F3">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المستشار القانوني">
  <title>المستشار القانوني | Full Speed</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="config.js"></script>
  <script>
    // الوضع الفاتح هو الأساسي؛ نطبّق اختيار المستخدم قبل رسم الصفحة حتى لا تومض

  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Cairo:wght@600;700;800&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================================
   المستشار القانوني — نظام التصميم (مستوحى من موقع Full Speed)
   أخضر Full Speed، خطوط رفيعة، شبكة مربعات تفاعلية، حركة ناعمة.
   الوضع الفاتح هو الأساسي، والغامق بزر في الشريط العلوي.
   ========================================================================= */
:root {
  color-scheme: light;
  --bg: #F4F6F3; --bg-2: #EBF1EA; --surface: #FFFFFF; --surface-2: #F2F8F3; --surface-3: #E7EEE6;
  --line: #DCE5DB; --line-2: #C4D2C4;
  --green: #187A31; --green-hi: #1E8E39; --green-2: #34B24C; --green-soft: #E3F1E5; --deep: #0F2A17;
  --ink: #0C150E; --ink-2: #26352A; --muted: #5A6D5F; --dim: #7A8E7D;
  --on-green: #FFFFFF; --gold: #946609;
  --ok: #187A31; --ok-bg: #E3F1E5; --warn: #8A5A00; --warn-bg: #FFF4DC; --bad: #B42318; --bad-bg: #FDECEA; --info: #22577A; --info-bg: #E6F0F6;
  --cell: #E7EEE6; --cell-line: #DCE5DB; --glow: rgba(30, 142, 57, .30);
  --shadow: 0 1px 2px rgba(12, 21, 14, .05), 0 1px 1px rgba(12, 21, 14, .03);
  --shadow-lg: 0 18px 50px -12px rgba(12, 40, 20, .22);
  --radius: 16px; --radius-sm: 11px;
  --side-w: 264px;
  --font-ar: "IBM Plex Sans Arabic", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar-display: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070A08; --bg-2: #0B120D; --surface: #0F1912; --surface-2: #13201A; --surface-3: #182A1F;
  --line: #1D2C21; --line-2: #2A3E2F;
  --green: #34B24C; --green-hi: #5BD06F; --green-2: #34B24C; --green-soft: #12301B; --deep: #0B2112;
  --ink: #E6F3E8; --ink-2: #C9DCCD; --muted: #94AC99; --dim: #7A9180;
  --on-green: #04140A; --gold: #E2A838;
  --ok: #5BD06F; --ok-bg: #102A18; --warn: #E2A838; --warn-bg: #2B210B; --bad: #FF7A6E; --bad-bg: #2E1412; --info: #7FC1E8; --info-bg: #0F2230;
  --cell: #0E1812; --cell-line: #16231A; --glow: rgba(52, 178, 76, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ar); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; transition: background-color .45s var(--ease), color .45s var(--ease); min-height: 100vh; }
::selection { background: var(--green); color: var(--on-green); }
a { color: var(--green); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-ar-display); line-height: 1.35; text-wrap: balance; }
p { margin: 0 0 8px; }
:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; border-radius: 6px; }
.hidden { display: none !important; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
.kicker { display: inline-flex; align-items: center; gap: 12px; color: var(--green); font-family: var(--font-ar); font-weight: 600; font-size: 13px; }
.kicker::before { content: ""; width: 28px; height: 1px; background: currentColor; }
.spacer { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .g2, .g3 { grid-template-columns: 1fr; } }

/* ============ الشعار ============ */
.logo { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.logo-mark { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--deep);
  box-shadow: 0 0 0 1px var(--line-2), 0 8px 24px -10px var(--glow); overflow: hidden; }
.logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.logo-text { display: flex; flex-direction: column; line-height: 1.15; }
.logo-text b { white-space: nowrap; font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; text-transform: uppercase; font-weight: 800; }
.logo-text b em { font-style: normal; color: var(--green-2); }
.logo-text span { font-size: 12px; color: var(--muted); }

/* ============ الأزرار والحقول ============ */
.btn { --b: var(--ink); position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; background: var(--ink); color: var(--bg); font: 600 14px/1 var(--font-ar); padding: 12px 20px; border-radius: 999px;
  cursor: pointer; transition: transform .2s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -12px rgba(12, 21, 14, .45); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.accent { background: var(--green); color: var(--on-green); }
.btn.accent:hover { background: var(--green-hi); box-shadow: 0 12px 28px -10px var(--glow); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--green); color: var(--green); box-shadow: none; }
.btn.soft { background: var(--green-soft); color: var(--green); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 8px 13px; font-size: 13px; }
.btn.icon { padding: 9px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn .ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .22; animation: ripple .6s var(--ease-out); pointer-events: none; }
@keyframes ripple { to { transform: scale(2.6); opacity: 0; } }
.btn .arrow { transition: transform .25s var(--ease); }
.btn:hover .arrow { transform: translateX(-4px); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--muted); }
.input { width: 100%; font: 15px/1.6 var(--font-ar); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  padding: 11px 14px; transition: border-color .2s, box-shadow .2s, background .3s; }
.input:hover { border-color: var(--dim); }
.input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 16%, transparent); }
textarea.input { resize: vertical; min-height: 44px; }
select.input { cursor: pointer; }
input[type=file].input { padding: 8px; }
input[type=checkbox] { accent-color: var(--green); width: 16px; height: 16px; }

/* ============ البطاقات ============ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 18px;
  transition: border-color .3s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease), background .45s var(--ease); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; display: flex; gap: 8px; align-items: center; }
.card-head h2 .i { color: var(--green); }
.lift { cursor: pointer; }
.lift:hover { border-color: var(--green); transform: translateY(-3px); box-shadow: var(--shadow-lg); }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge .i { width: 14px; height: 14px; }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); } .b-info { background: var(--surface-3); color: var(--ink-2); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; margin: 10px 0; font-size: 14px; border: 1px solid transparent; }
.alert .i { margin-top: 3px; }
.alert.ok { background: var(--ok-bg); color: var(--ok); } .alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.bad { background: var(--bad-bg); color: var(--bad); } .alert.info { background: var(--info-bg); color: var(--info); }
.alert ul { padding-inline-start: 18px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; position: relative; flex-wrap: wrap; }
.seg button { white-space: nowrap; position: relative; z-index: 1; border: none; background: transparent; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  font: 600 13.5px var(--font-ar); color: var(--muted); transition: color .25s, background .25s; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--green); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.tabs-scroll { overflow-x: auto; scrollbar-width: none; }
.tabs-scroll .seg { flex-wrap: nowrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--green-soft); color: var(--green);
  border: 1px solid transparent; cursor: pointer; margin: 2px; transition: border-color .2s, transform .2s; }
.chip:hover { border-color: var(--green); transform: translateY(-1px); }
.chip .i { width: 15px; height: 15px; }

.skeleton div { height: 12px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.spin { width: 18px; height: 18px; border: 2px solid var(--line-2); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-line { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.empty { text-align: center; color: var(--muted); padding: 28px 10px; }

.tw { overflow-x: auto; }
.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th, .t td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; }
.t th { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.t tbody tr { transition: background .2s; }
.t tbody tr:hover { background: var(--surface-2); }

.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--ink); margin-top: 4px; }
.sec { margin-top: 18px; }
.sec-t { font-weight: 700; font-family: var(--font-ar-display); font-size: 15px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.sec-t .n { width: 26px; height: 26px; border-radius: 8px; background: var(--green); color: var(--on-green); display: grid; place-items: center; font-size: 13px; font-family: var(--font-mono); }
.sec-t .i { color: var(--green); }
details.more summary { cursor: pointer; color: var(--green); font-weight: 600; font-size: 14px; margin: 6px 0 14px; }

/* ============ الدخول: شبكة مربعات تفاعلية بملء الشاشة ============ */
.auth { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse 60% 50% at 85% 20%, color-mix(in srgb, var(--green) 10%, transparent), transparent 70%),
              radial-gradient(ellipse 50% 45% at 10% 90%, color-mix(in srgb, var(--green) 7%, transparent), transparent 70%), var(--bg); }
.auth-wrap { width: 100%; max-width: 1180px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
.auth-intro h1 { font-family: var(--font-ar-display); font-weight: 800; font-size: clamp(34px, 4.6vw, 60px); line-height: 1.2; margin: 18px 0 14px; letter-spacing: -.01em; }
.auth-intro h1 em { font-style: normal; color: var(--green); }
.auth-intro p { color: var(--muted); font-size: 17px; max-width: 520px; }
.typer { margin-top: 22px; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px;
  max-width: 560px; box-shadow: var(--shadow); font-size: 15px; min-height: 48px; }
.typer .i { color: var(--green); }
.typer .caret { display: inline-block; width: 2px; height: 18px; background: var(--green); margin-inline-start: 2px; vertical-align: middle; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.auth-points { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 24px; color: var(--ink-2); font-size: 14px; }
.auth-points div { display: flex; gap: 8px; align-items: center; }
.auth-points .i { color: var(--green); }
.auth-card { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: var(--shadow-lg); }
.auth-card h2 { font-size: 24px; font-weight: 800; }
.auth-card .sub { color: var(--muted); font-size: 14px; margin: 4px 0 20px; }
.auth-top { position: absolute; top: 0; inset-inline: 0; display: flex; align-items: center; padding: 20px clamp(16px, 4vw, 56px); gap: 12px; }
.auth-foot { position: absolute; bottom: 14px; inset-inline: 0; text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin: 16px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#gbtn { display: flex; justify-content: center; min-height: 44px; }
.linkbtn { background: none; border: none; color: var(--green); font: 600 13px var(--font-ar); cursor: pointer; padding: 4px 0; }
.linkbtn:hover { text-decoration: underline; }
@media (max-width: 900px) {
  .auth { align-items: start; padding-top: 96px; padding-bottom: 60px; }
  .auth-wrap { grid-template-columns: 1fr; gap: 26px; }
  .auth-intro h1 { font-size: 32px; margin-top: 10px; }
  .auth-intro p, .auth-points { display: none; }
  .typer { font-size: 13.5px; }
  .auth-card { padding: 24px 20px; }
}

/* ============ هيكل التطبيق ============ */
.shell { display: flex; min-height: 100vh; }
.sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--side-w); background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 14px; z-index: 30; transition: width .35s var(--ease), background .45s var(--ease); }
.sidebar .logo { padding: 2px 6px 18px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.nav a { position: relative; z-index: 1; display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 12px; color: var(--muted); font-weight: 600;
  cursor: pointer; transition: color .2s; white-space: nowrap; overflow: hidden; }
.nav a:hover { color: var(--ink); }
.nav a.active { color: var(--green); }
.nav a .badge { margin-inline-start: auto; }
.nav-ind { position: absolute; inset-inline: 0; height: 46px; border-radius: 12px; background: var(--green-soft); transition: transform .4s var(--ease-out), height .3s, opacity .2s; z-index: 0; }
.nav-ind::before { content: ""; position: absolute; inset-inline-start: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--green); }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 2px; }
.side-foot a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--muted); cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; }
.side-foot a:hover { background: var(--surface-2); color: var(--ink); }
.me { display: flex; gap: 10px; align-items: center; padding: 6px 8px 10px; overflow: hidden; }
.me b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me span { font-size: 12px; color: var(--muted); }
.avatar { width: 38px; height: 38px; border-radius: 12px; background: var(--green); color: var(--on-green); display: grid; place-items: center; font-weight: 800; flex: none; }
.collapse-btn { position: absolute; top: 26px; inset-inline-end: -14px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: transform .35s var(--ease), color .2s; }
.collapse-btn:hover { color: var(--green); border-color: var(--green); }
.collapse-btn .i { width: 15px; height: 15px; }
.shell.mini { --side-w: 84px; }
.shell.mini .logo-text, .shell.mini .nav a span, .shell.mini .me div, .shell.mini .side-foot a span, .shell.mini .side-foot .credit, .shell.mini .nav a .badge { display: none; }
.shell.mini .nav a, .shell.mini .side-foot a { justify-content: center; }
.shell.mini .collapse-btn { transform: rotate(180deg); }

.main { flex: 1; min-width: 0; margin-inline-start: var(--side-w); transition: margin .35s var(--ease); display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 3vw, 40px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .3s, background .45s; }
.topbar.scrolled { border-bottom-color: var(--line); }
.title-wrap h1 { font-size: 22px; font-weight: 800; }
.crumb { font-size: 12.5px; color: var(--muted); }
.mob-logo { display: none; }
.searchbtn { display: flex; align-items: center; gap: 10px; min-width: 260px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--muted); cursor: pointer; font: 14px var(--font-ar); transition: border-color .2s, box-shadow .2s; }
.searchbtn:hover { border-color: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 10%, transparent); }
.searchbtn kbd { margin-inline-start: auto; font: 11px var(--font-mono); padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); direction: ltr; }
.tb-icon { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer; transition: border-color .2s, color .2s, transform .3s var(--ease); }
.tb-icon:hover { border-color: var(--green); color: var(--green); }
.tb-icon .dot { position: absolute; top: 9px; inset-inline-end: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 0 2px var(--surface); }
.tb-icon.spin-once .i { animation: spin .5s var(--ease); }
.content { padding: 8px clamp(16px, 3vw, 40px) 40px; width: 100%; }
.page-credit { display: none; }
.bottomnav { display: none; }

@media (max-width: 900px) {
  .sidebar, .collapse-btn { display: none; }
  .main { margin: 0; }
  .topbar { padding: 12px 16px; }
  .mob-logo { display: block; }
  .title-wrap { display: none; }
  .searchbtn { min-width: 0; width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 50%; flex: none; }
  .searchbtn span, .searchbtn kbd { display: none; }
  .topbar .logo-text span { display: none; }
  .composer { bottom: calc(64px + env(safe-area-inset-bottom)); padding-top: 10px; }
  .composer-box { border-radius: 18px; padding: 8px; }
  .composer textarea { font-size: 15px; }
  .composer .seg button { padding: 6px 11px; font-size: 12.5px; }
  .composer .tb-icon { width: 38px; height: 38px; }
  #newchat { padding: 8px; font-size: 0; gap: 0; }
  #newchat .i { margin: 0; }
  .privacy { display: none; }
  .bubble-q { max-width: 92%; }
  .content { padding: 8px 14px 110px; }
  .bottomnav { display: flex; position: fixed; bottom: 0; inset-inline: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bottomnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 6px 0; cursor: pointer; border-radius: 12px; transition: color .2s; }
  .bottomnav a.active { color: var(--green); }
  .bottomnav a.active .i { transform: translateY(-2px); }
  .bottomnav a .i { transition: transform .3s var(--ease-out); width: 22px; height: 22px; }
  .page-credit { display: block; text-align: center; padding: 18px 0 4px; }
}
.credit { font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.credit b { color: var(--ink-2); }
.credit a { color: var(--green); font-family: var(--font-mono); letter-spacing: .06em; }

/* ============ الحركة ============ */
.view-in > * { animation: rise .55s var(--ease-out) both; }
.view-in > *:nth-child(2) { animation-delay: .05s; } .view-in > *:nth-child(3) { animation-delay: .1s; } .view-in > *:nth-child(4) { animation-delay: .15s; }
.view-in > *:nth-child(5) { animation-delay: .2s; } .view-in > *:nth-child(n+6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

/* ============ الرئيسية ============ */
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 24px; padding: clamp(24px, 4vw, 44px);
  background: radial-gradient(ellipse 55% 90% at 0% 100%, rgba(52, 178, 76, .22), transparent 70%), linear-gradient(135deg, #0F2A17, #0A1C10); color: #E6F3E8; border: 1px solid var(--line); margin-bottom: 18px; }
.hero .kicker { color: #5BD06F; }
.hero h2 { font-size: clamp(26px, 3.2vw, 40px); font-weight: 800; margin: 10px 0 6px; color: #fff; }
.hero h2 em { font-style: normal; color: #5BD06F; }
.hero p { color: #A9C2AE; max-width: 560px; }
.hero-ask { display: flex; gap: 8px; margin-top: 20px; max-width: 640px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px; }
.hero-ask input { flex: 1; min-width: 0; background: transparent; border: none; color: #fff; font: 15px var(--font-ar); padding: 8px 14px; }
.hero-ask input::placeholder { color: #8FA894; }
.hero-ask input:focus { outline: none; }
.hero-ask .btn.accent { background: #34B24C; color: #04140A; }
.stat { position: relative; overflow: hidden; }
.stat .v { font-family: var(--font-display); font-size: 46px; font-weight: 800; line-height: 1; margin: 8px 0 4px; color: var(--ink); }
.stat .l { color: var(--muted); font-size: 13.5px; }
.stat .ic { position: absolute; top: 18px; inset-inline-end: 18px; width: 40px; height: 40px; border-radius: 12px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.quick { display: flex; flex-direction: column; gap: 10px; }
.quick .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; transition: transform .4s var(--ease-out), background .3s, color .3s; }
.quick:hover .ic { transform: rotate(-8deg) scale(1.06); background: var(--green); color: var(--on-green); }
.quick h3 { font-size: 16px; }
.quick p { color: var(--muted); font-size: 13.5px; margin: 0; }
.list-row { display: flex; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s, padding .25s var(--ease); border-radius: 8px; }
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--surface-2); padding-inline-start: 10px; }
.list-row .t1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .i { color: var(--green); }
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }

/* ============ اسأل: محادثة + لوحة المواد ============ */
.ask-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 1200px) { .ask-layout { grid-template-columns: 1fr; } .refs-panel { display: none; } }
.thread { display: flex; flex-direction: column; gap: 16px; min-height: 40vh; }
.welcome { text-align: center; padding: 30px 10px 10px; }
.welcome .orb { width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 22px; background: var(--deep); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px -14px var(--glow);
  animation: float 5s ease-in-out infinite; overflow: hidden; }
.welcome .orb img { width: 100%; height: 100%; }
@keyframes float { 50% { transform: translateY(-6px); } }
.welcome h2 { font-size: 26px; font-weight: 800; }
.welcome p { color: var(--muted); }
.suggs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; text-align: start; }
@media (max-width: 640px) { .suggs { grid-template-columns: 1fr; } }
.sugg { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px;
  transition: border-color .2s, transform .25s var(--ease), box-shadow .25s; }
.sugg:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.sugg .i { color: var(--green); margin-top: 3px; }
.bubble-q { align-self: flex-start; max-width: 80%; background: var(--green); color: var(--on-green); padding: 12px 16px; border-radius: 18px 18px 18px 6px; font-weight: 500;
  animation: rise .4s var(--ease-out) both; white-space: pre-wrap; }
.composer { position: sticky; bottom: 0; z-index: 5; padding: 14px 0 6px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.composer-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 22px; padding: 10px 10px 10px 12px; box-shadow: var(--shadow-lg); transition: border-color .2s, box-shadow .2s; }
.composer-box:focus-within { border-color: var(--green); box-shadow: var(--shadow-lg), 0 0 0 4px color-mix(in srgb, var(--green) 12%, transparent); }
.composer textarea { width: 100%; border: none; background: transparent; resize: none; font: 15.5px/1.7 var(--font-ar); color: var(--ink); padding: 6px 8px; max-height: 220px; }
.composer textarea:focus { outline: none; }
.composer .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mic.rec { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(180, 35, 24, .45); } 100% { box-shadow: 0 0 0 14px rgba(180, 35, 24, 0); } }
.privacy { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 8px; padding: 0 6px; }
.privacy .i { color: var(--green); width: 16px; height: 16px; }
.thinking { display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); animation: rise .4s var(--ease-out) both; align-self: stretch; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
.thinking .step { color: var(--muted); font-size: 14px; transition: opacity .3s; }

.answer { margin: 0; padding: 0; overflow: hidden; }
.answer > * { animation: rise .5s var(--ease-out) both; }
.answer .a-head { padding: 18px 22px 0; }
.answer .a-body { padding: 0 22px 18px; }
.answer .q { display: none; }
.summary { font-size: 16.5px; font-weight: 600; margin: 12px 0 4px; line-height: 1.8; color: var(--ink); }
.quote { border: 1px solid var(--line); border-inline-start: 3px solid var(--green); background: var(--surface-2); padding: 12px 14px; border-radius: 12px; margin-bottom: 10px; white-space: pre-line; font-size: 14.5px; }
.quote .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; white-space: normal; }
.quote .why { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: normal; }
.md p { margin: 0 0 8px; } .md ul { margin: 0 0 8px; padding-inline-start: 20px; } .md li { margin-bottom: 4px; }
.examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .examples { grid-template-columns: 1fr; } }
.example { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); transition: border-color .2s, transform .25s var(--ease); }
.example:hover { border-color: var(--green); transform: translateY(-2px); }
.example h4 { font-size: 14.5px; margin-bottom: 6px; color: var(--green); }
.example .out { margin-top: 8px; font-size: 13.5px; padding-top: 8px; border-top: 1px dashed var(--line-2); }
.a-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--surface-2); }
.feedback { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.refs-panel { position: sticky; top: 86px; max-height: calc(100vh - 110px); overflow: auto; padding: 18px; }
.refs-panel .ref { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 13.5px; animation: pop .35s var(--ease-out) both; background: var(--surface-2); }
.refs-panel .ref h4 { font-size: 13.5px; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.refs-panel .ref .tx { color: var(--ink-2); max-height: 150px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); white-space: pre-line; }

/* ============ الجزاءات (معالج بخطوات) ============ */
.stepper { display: flex; gap: 0; margin-bottom: 18px; counter-reset: st; }
.stepper div { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; font-size: 14px; position: relative; }
.stepper div:not(:last-child)::after { content: ""; flex: 1; height: 2px; background: var(--line); margin: 0 10px; border-radius: 2px; transition: background .4s; }
.stepper b { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); flex: none; transition: all .35s var(--ease); }
.stepper .on { color: var(--ink); } .stepper .on b { border-color: var(--green); color: var(--green); box-shadow: 0 0 0 5px color-mix(in srgb, var(--green) 14%, transparent); }
.stepper .done { color: var(--green); } .stepper .done b { background: var(--green); border-color: var(--green); color: var(--on-green); }
.stepper .done::after { background: var(--green) !important; }
@media (max-width: 640px) { .stepper span { display: none; } }
.vlist { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
.vitem { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; transition: background .2s, padding .25s var(--ease); }
.vitem:hover { background: var(--surface-2); padding-inline-start: 18px; }
.vitem.on { background: var(--green-soft); }
.vitem .no { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--green); min-width: 34px; }
.result-big { font-family: var(--font-ar-display); font-size: 26px; font-weight: 800; color: var(--green); }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
@media (max-width: 640px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.levels div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13px; transition: all .3s; }
.levels div b { display: block; font-size: 12px; color: var(--muted); }
.levels .on { border-color: var(--green); background: var(--green-soft); transform: translateY(-2px); box-shadow: 0 10px 24px -14px var(--glow); }
.steps { padding-inline-start: 20px; } .steps li { margin-bottom: 6px; }

/* ============ القوانين ============ */
.src-card h3 { font-size: 17px; }
.src-card .bar { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 14px; overflow: hidden; }
.src-card .bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; transform-origin: right; animation: grow 1s var(--ease-out) both; }
@keyframes grow { from { transform: scaleX(0); } }
.art { padding: 16px 0; border-bottom: 1px solid var(--line); }
.art:last-child { border-bottom: none; }
.art h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.art .ch { color: var(--muted); font-size: 12px; font-weight: 500; }
.art .tx { white-space: pre-line; color: var(--ink-2); margin-top: 6px; }
.star { color: var(--dim); }
.star.on { color: var(--gold); }
.star.on .i { fill: currentColor; }
mark.hl { background: color-mix(in srgb, var(--green) 22%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }

/* ============ نوافذ ولوحة البحث ============ */
.modal-bg { position: fixed; inset: 0; background: rgba(4, 12, 6, .5); backdrop-filter: blur(3px); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .2s; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; width: 100%; max-width: 720px; max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: pop .3s var(--ease-out); }
.modal.wide { max-width: 920px; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { font-size: 16px; flex: 1; }
.modal-b { padding: 16px 20px; overflow-y: auto; }
.modal-b.pre { white-space: pre-line; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.x { background: transparent; border: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.x:hover { background: var(--surface-2); color: var(--ink); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 640px) {
  .modal-bg { align-items: end; padding: 0; }
  .modal { border-radius: 22px 22px 0 0; max-height: 90vh; animation: sheet .35s var(--ease-out); }
}
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
.pv { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; display: grid; gap: 8px; background: var(--surface-2); }
mark.pii { background: #FFE1CC; color: #8A3300; border-radius: 4px; padding: 0 3px; }
.sheet-menu { display: grid; gap: 4px; padding: 6px; }
.sheet-menu a { display: flex; gap: 12px; align-items: center; padding: 13px 12px; border-radius: 12px; cursor: pointer; color: var(--ink); font-weight: 500; }
.sheet-menu a:hover { background: var(--surface-2); }
.sheet-menu .sep { height: 1px; background: var(--line); margin: 4px 0; }

.palette { position: fixed; inset: 0; z-index: 60; background: rgba(4, 12, 6, .45); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; animation: fade .15s; }
.palette-box { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .25s var(--ease-out); }
.palette-in { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.palette-in input { flex: 1; border: none; background: transparent; font: 17px var(--font-ar); color: var(--ink); }
.palette-in input:focus { outline: none; }
.palette-in .i { color: var(--green); }
.palette-list { max-height: 52vh; overflow: auto; padding: 8px; }
.palette-list .grp { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; }
.palette-list a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: var(--ink); }
.palette-list a .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette-list a > div { min-width: 0; flex: 1; }
.palette-list a.sel { background: var(--green-soft); color: var(--green); }
.palette-list a .i { color: var(--green); }
@media (max-width: 640px) { .palette { padding-top: 10px; } }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); display: flex; gap: 8px; align-items: center;
  padding: 12px 18px; border-radius: 14px; z-index: 70; box-shadow: var(--shadow-lg); font-size: 14px; max-width: calc(100% - 32px); animation: toastIn .35s var(--ease-out); }
.toast .i { color: var(--green-2); }
.toast.bad { background: var(--bad); color: #fff; } .toast.bad .i { color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px); } }
@media (max-width: 900px) { .toast { bottom: 92px; } }

/* ============ الطباعة (حفظ الإجابة PDF) ============ */
@media print {
  body * { visibility: hidden; }
  .printing, .printing * { visibility: visible; }
  .printing { position: absolute; inset: 0 0 auto; border: none; box-shadow: none; }
  .printing .a-actions { display: none; }
  .printing::before { content: "المستشار القانوني — Full Speed"; display: block; font-weight: 800; font-size: 18px; margin: 0 22px 8px; visibility: visible; }
}

/* ============ ملاءمة شاشة الموبايل ============ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: clip; }
img, svg, video { max-width: 100%; }
.content, .card, .main, .thread, .answer, .quote, .summary, .md, .art .tx, .list-row .t1, .vitem span { overflow-wrap: anywhere; }
.main, .ask-layout > *, .dash-grid > *, .grid > * { min-width: 0; }
@media (max-width: 900px) {
  /* خط 16px في الحقول يمنع الآيفون من تكبير الصفحة عند الكتابة */
  .input, select.input, textarea.input, .composer textarea, .hero-ask input, .palette-in input { font-size: 16px; }
  .card { padding: 16px; border-radius: 14px; margin-bottom: 14px; }
  .grid { gap: 12px; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat .v { font-size: 34px; }
  .stat .ic { width: 34px; height: 34px; top: 14px; inset-inline-end: 14px; }
  .hero { border-radius: 18px; padding: 22px 18px; }
  .hero h2 { font-size: 23px; }
  .hero p { font-size: 14px; }
  .hero-ask .btn { padding: 10px 14px; }
  .quick { padding: 14px; }
  .quick .ic { width: 40px; height: 40px; }
  .quick p { display: none; }
  .row { gap: 8px; }
  .row > .input { min-width: 0 !important; }
  .card-head h2 { font-size: 16px; }
  .levels div, .example { padding: 10px; }
  .tabs-scroll { margin-inline: -4px; }
  .modal-b, .modal-h, .modal-f { padding-inline: 16px; }
  .modal-f .btn { flex: 1; }
  .a-actions { padding: 10px 14px; }
  .answer .a-head, .answer .a-body { padding-inline: 14px; }
  .t th, .t td { padding: 9px 6px; font-size: 13px; }
  .welcome { padding-top: 10px; }
  .welcome h2 { font-size: 21px; }
  .welcome .orb { width: 58px; height: 58px; }
  .stepper b { width: 28px; height: 28px; }
  .stepper div:not(:last-child)::after { margin: 0 6px; }
  .vlist { max-height: 55vh; }
  .auth { padding-inline: 14px; }
  .auth-intro h1 { font-size: 27px; }
  .logo-text b { white-space: nowrap; font-size: 20px; }
  .topbar .logo-mark { width: 38px; height: 38px; }
  .seg button { white-space: nowrap; padding: 8px 13px; }
  .kpi .v { font-size: 28px; }
  .kpi { padding: 14px 16px; }
}
@media (max-width: 380px) {
  .g4 { grid-template-columns: 1fr 1fr; }
  .stat .v { font-size: 28px; }
  .logo-text b { font-size: 19px; }
  .tb-icon { width: 38px; height: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

var state = { token: null, user: null, view: 'home', sources: {}, session: [] };

// داخل رابط Apps Script نستخدم google.script.run، وفي التطبيق المستقل (GitHub Pages) نكلم doPost
var API_URL = window.FS_API_URL || '';
var IS_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
var IS_APP = !IS_GAS && !!API_URL;

function api(action, data) {
  return new Promise(function (resolve, reject) {
    var req = { action: action, token: state.token, data: data || {} };
    var done = function (res) {
      if (!res) return reject(new Error('لا يوجد رد من الخادم'));
      if (res.ok) return resolve(res.data);
      if (res.auth === false) { logoutLocal(); }
      reject(new Error(res.error || 'حدث خطأ'));
    };
    if (IS_GAS) {
      google.script.run.withSuccessHandler(done)
        .withFailureHandler(function (err) { reject(new Error((err && err.message) || 'تعذر الاتصال بالخادم')); })
        .api(req);
      return;
    }
    if (!API_URL) return reject(new Error('رابط السيرفر غير مضبوط في config.js'));
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 330000);
    // بدون Content-Type حتى لا يرسل المتصفح طلب preflight (Apps Script لا يرد عليه)
    fetch(API_URL, { method: 'POST', body: JSON.stringify(req), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (res) { clearTimeout(timer); done(res); })
      .catch(function (err) {
        clearTimeout(timer);
        reject(new Error(navigator.onLine === false ? 'لا يوجد اتصال بالإنترنت' : 'تعذر الاتصال بالخادم، حاول مرة أخرى'));
      });
  });
}

  navigator.serviceWorker.register('sw.js').catch(function () {});
}

function toast(msg, bad) {
  $$('.toast').forEach(function (old) { old.parentNode.removeChild(old); }); // إشعار واحد في كل مرة
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.innerHTML = ic(bad ? 'alert' : 'check') + '<span></span>';
  t.lastChild.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3800);
}

function modal(title, bodyHtml, footHtml) {
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><h3>' + esc(title) + '</h3>' +
    '<button class="x" data-close aria-label="إغلاق">' + ic('x') + '</button></div><div class="modal-b">' + bodyHtml + '</div>' +
    (footHtml ? '<div class="modal-f">' + footHtml + '</div>' : '') + '</div>';
  // النوافذ التي فيها نماذج (data-sticky) لا تُغلق بالضغط خارجها حتى لا يضيع المكتوب
  bg.addEventListener('click', function (e) { if ((e.target === bg && !bg.dataset.sticky) || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

var TYPER_LINES = ['موظف غاب 3 أيام بدون إذن… ما الجزاء؟', 'كيف أحسب الأجر الإضافي في يوم الراحة؟', 'ما الحد الأقصى للخصم من المرتب؟',
  'مدة إجازة الوضع للموظفة كام يوم؟', 'نسبة اشتراك التأمينات على صاحب العمل؟'];
function startTyper(el) {
  var li = 0, ci = 0, del = false;
  (function tick() {
    if (!document.body.contains(el)) return;
    var line = TYPER_LINES[li];
    el.textContent = line.slice(0, ci);
    if (!del && ci < line.length) { ci++; setTimeout(tick, 45); }
    else if (!del) { del = true; setTimeout(tick, 1800); }
    else if (ci > 0) { ci -= 2; if (ci < 0) ci = 0; setTimeout(tick, 18); }
    else { del = false; li = (li + 1) % TYPER_LINES.length; setTimeout(tick, 300); }
  })();
}

/** يقرأ ملف البيانات من جهاز المستخدم ويرفعه على أجزاء صغيرة. */
function uploadDataFile(file, action, extra, onProgress) {
  return new Promise(function (resolve, reject) {
    if (!file) return reject(new Error('اختر ملف البيانات FullSpeed_Legal_Data.json'));
    if (!/\.json$/i.test(file.name)) return reject(new Error('ملف البيانات يجب أن يكون FullSpeed_Legal_Data.json'));
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('تعذرت قراءة الملف')); };
    reader.onload = function () { uploadChunks(String(reader.result), action, extra, onProgress).then(resolve, reject); };
    reader.readAsText(file, 'utf-8');
  });
}

function openPalette() {

  document.body.appendChild(p);
  var input = $('#pq'), list = $('#pl'), items = [], sel = 0, timer = null, seq = 0;
  var pages = VIEWS.filter(function (x) { return x[0] !== 'admin' || isAdmin(); }).map(function (x) { return { kind: 'page', icon: x[2], title: x[1], go: x[0] }; })
    .concat([{ kind: 'page', icon: 'star', title: 'المفضلة', act: showFavorites }, { kind: 'page', icon: 'bell', title: 'إيه الجديد', act: showNews },

  var draw = function (arts, loading) {
    var q = input.value.trim();
    var pg = pages.filter(function (x) { return !q || x.title.indexOf(q) >= 0; });
    items = pg.concat(arts || []);
    if (q && q.length >= 2) items.unshift({ kind: 'ask', icon: 'ask', title: 'اسأل المستشار: "' + q + '"', q: q });
    sel = Math.min(sel, Math.max(0, items.length - 1));
    var html = '', lastKind = '';
    items.forEach(function (it, i) {
      var grp = it.kind === 'art' ? 'مواد' : it.kind === 'page' ? 'صفحات' : '';
      if (grp && grp !== lastKind) html += '<div class="grp">' + grp + '</div>';
      lastKind = grp || lastKind;
      html += '<a data-i="' + i + '"' + (i === sel ? ' class="sel"' : '') + '>' + ic(it.icon) + '<div><div>' + esc(it.title) + '</div>' + (it.sub ? '<div class="sub">' + esc(it.sub) + '</div>' : '') + '</div></a>';
    });

    list.innerHTML = html || '<div class="empty">مفيش نتائج</div>';

  };
  var run = function (it) {
    if (!it) return;
    close();
    if (it.kind === 'ask') go('ask', { q: it.q, send: true });
    else if (it.kind === 'art') showArticle(it.source, it.num);
    else if (it.act) it.act();
    else go(it.go);
  };
  var close = function () { p.remove(); document.removeEventListener('keydown', keys, true); };
  var keys = function (e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); draw(items.filter(function (x) { return x.kind === 'art'; })); scrollSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(items.filter(function (x) { return x.kind === 'art'; })); scrollSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(items[sel]); }
  };
  var scrollSel = function () { var a = $('a.sel', list); if (a) a.scrollIntoView({ block: 'nearest' }); };
  document.addEventListener('keydown', keys, true);
  p.addEventListener('click', function (e) { if (e.target === p || e.target.closest('[data-close]')) close(); });
  input.addEventListener('input', function () {
    sel = 0;
    var q = input.value.trim(), my = ++seq;

        }));

  setTimeout(function () { input.focus(); }, 30);
}

// ---------------- حماية البيانات الشخصية (تنبيه قبل الإرسال) ----------------
var COMMON_NAMES = ('محمد احمد محمود مصطفى علي ابراهيم عمر خالد ياسر طارق هشام وليد عمرو شريف ايمن اشرف حازم تامر رامي سامح شادي ' +
  'كمال جمال حسام عصام هاني ماجد مجدي ممدوح مدحت نبيل وائل يوسف يحيى زياد عبدالله عبدالرحمن عبدالعزيز عبدالحميد سيد السيد ' +
  'فاطمه مريم ساره سلمى منى مها هبه ياسمين دينا رانيا شيماء ايمان اسماء نهى غاده ريهام نرمين ايه اميره هاله سمر ندى رحاب').split(' ');
var TITLE_RE = /(?:الموظف|الموظفه|الموظفة|العامل|العامله|العاملة|الزميل|الزميله|الزميلة|زميلنا|زميلتنا|الاستاذ|الأستاذ|الاستاذه|الأستاذة|السيد|السيده|السيدة|المهندس|المهندسه|المهندسة|المدعو|المدعوه|المدعوة|اسمه|اسمها|أ\/|ا\/|م\/)\s+([ء-ي]{3,})(?:\s+([ء-ي]{3,}))?/g;
var NOT_NAME = ('غاب تاخر تأخر اتأخر رفض مشي ترك تغيب اتغيب تغيبت غابت عمل بيعمل يعمل كان قام جه جاء اخد أخذ سرق كسر طلب عايز يريد ' +
  'المسؤول المختص الجديد القديم المذكور المخالف الذي اللي التي في من على عن بعد قبل لم لا').split(' ');

function normAr(s) { return s.replace(/[إأآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }

function scanSensitive(text) {
  var hits = [];
  var t = text.replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x660); });
  var rules = [
    ['رقم قومي', /(^|[^\d])([23]\d{13})(?!\d)/g],
    ['رقم هاتف', /(^|[^\d])((?:\+?20|0020)?\s?0?1[0125][\s-]?\d{3,4}[\s-]?\d{4})(?!\d)/g],
    ['بريد إلكتروني', /()([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g],
    ['رقم حساب أو رقم طويل', /(^|[^\d])(\d{10,})(?!\d)/g]
  ];
  rules.forEach(function (r) {
    var m; while ((m = r[1].exec(t))) hits.push({ type: r[0], value: m[2], strong: true });
  });
  var m2;
  while ((m2 = TITLE_RE.exec(text))) {
    var w1 = m2[1], w2 = m2[2] || '';
    if (NOT_NAME.indexOf(normAr(w1)) >= 0 || NOT_NAME.indexOf(w1) >= 0) continue;
    var val = w1 + (w2 && NOT_NAME.indexOf(w2) < 0 ? ' ' + w2 : '');
    hits.push({ type: 'اسم شخص محتمل', value: val, strong: false });
  }
  (text.match(/[ء-ي]{3,}/g) || []).forEach(function (w) {
    if (COMMON_NAMES.indexOf(normAr(w)) >= 0 && !hits.some(function (h) { return h.value.indexOf(w) >= 0; })) {
      hits.push({ type: 'اسم شخص محتمل', value: w, strong: false });
    }
  });
  var seen = {};
  return hits.filter(function (h) { var k = h.type + h.value; if (seen[k]) return false; seen[k] = 1; return true; });
}

function redactText(text, hits) {
  var t = text.replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x660); });
  hits.forEach(function (h) {
    var rep = h.strong ? '[' + h.type + ' محذوف]' : '[اسم]';
    t = t.split(h.value).join(rep);
  });
  return t;
}

function privacyGate(text) {
  return new Promise(function (resolve) {
    var hits = scanSensitive(text);
    if (!hits.length) return resolve(text);
    var marked = esc(text);
    hits.forEach(function (h) { marked = marked.split(esc(h.value)).join('<mark class="pii">' + esc(h.value) + '</mark>'); });
    var onlyNames = hits.every(function (h) { return !h.strong; });
    var m = modal('تنبيه: بيانات شخصية في السؤال',
      '<div class="alert warn">' + ic('shield') + '<div>الأسئلة تُرسل لخدمة Google Gemini المجانية، وقد تستخدم Google ما يُرسل إليها لتحسين خدماتها. ' +
      'لا تُرسل أسماء الموظفين أو أرقامهم القومية أو هواتفهم؛ السؤال يُفهم بنفس الدقة بدونها.</div></div>' +
      '<div class="small muted" style="margin:8px 0 4px">تم العثور على:</div><div>' +
      hits.map(function (h) { return '<span class="badge b-warn" style="margin:2px">' + esc(h.type) + ': ' + esc(h.value) + '</span>'; }).join('') +
      '</div><div class="quote" style="border-inline-start-color:var(--warn);margin-top:12px">' + marked + '</div>',
      '<button class="btn accent" data-a="redact">احذفها وأرسل</button><button class="btn ghost" data-a="edit">تعديل السؤال</button>' +
      (onlyNames ? '<button class="btn ghost" data-a="send">ليست أسماء أشخاص، أرسل</button>' : ''));
    $$('[data-a]', m).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.a; m.remove();
        if (a === 'redact') resolve(redactText(text, hits));
        else if (a === 'send') resolve(text);
        else resolve(null);
      });
    });
    m.addEventListener('click', function (e) { if (e.target === m || e.target.closest('[data-close]')) resolve(null); });
  });
}

/** السؤال بالصوت (Web Speech API — مجاني ومدعوم في Chrome و Edge و Safari). */
function setupMic(btn, target) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { btn.classList.add('hidden'); return; }
  var rec = null;
  btn.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ar-EG'; rec.interimResults = true; rec.continuous = false;
    var base = target.value ? target.value.trim() + ' ' : '';
    rec.onresult = function (e) {
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      target.value = base + t; target.dispatchEvent(new Event('input'));
    };
    rec.onerror = function (e) { toast(e.error === 'not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون' : 'معرفتش أسمع كويس، جرّب تاني', true); };
    rec.onend = function () { rec = null; btn.classList.remove('rec'); };
    btn.classList.add('rec');
    rec.start();
    toast('اتكلم دلوقتي… 🎙️');
  });
}

function submitQuestion(mode) {
  var raw = $('#q').value.trim();
  if (raw.length < 5) { toast('اكتب السؤال بتفصيل أكتر', true); return; }
  privacyGate(raw).then(function (text) {
    if (text === null) { $('#q').focus(); return; }
    var thread = $('#thread'), btn = $('#send');
    var w = $('.welcome', thread); if (w) w.remove();
    btn.disabled = true;
    $('#q').value = ''; $('#q').style.height = 'auto';
    thread.insertAdjacentHTML('beforeend', '<div class="bubble-q">' + esc(text) + '</div>');
    var box = document.createElement('div');
    box.className = 'thinking';
    box.innerHTML = '<div class="dots"><i></i><i></i><i></i></div><span class="step">' + THINK_STEPS[0] + '</span>';
    thread.appendChild(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var si = 0, stepTimer = setInterval(function () {
      si = Math.min(THINK_STEPS.length - 1, si + 1);
      var s = $('.step', box); if (s) { s.style.opacity = 0; setTimeout(function () { s.textContent = THINK_STEPS[si]; s.style.opacity = 1; }, 250); }
    }, 2200);
    var history = state.session.slice(-3).map(function (r) { return { question: r.question, summary: r.answer.summary }; });
    api('ask', { question: text, mode: mode, history: history }).then(function (r) {
      state.session.push(r);
      box.outerHTML = renderAnswer(r);
      showRefs(r);
      var cards = $$('.answer', thread); var last = cards[cards.length - 1];
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (!$('#newchat')) {
        var nc = document.createElement('button');
        nc.className = 'btn ghost sm'; nc.id = 'newchat'; nc.innerHTML = ic('plus') + 'محادثة جديدة';

    }).catch(function (e) {
      box.outerHTML = '<div class="alert bad">' + ic('alert') + '<div>' + esc(e.message) + '</div></div>';
    }).then(function () { clearInterval(stepTimer); btn.disabled = false; });
  });
}

/** لوحة "المواد المرتبطة": نصوص المواد اللي اعتمدت عليها آخر إجابة. */
function showRefs(r) {
  var box = $('#refl');

  var a = r.answer, refs = [], seen = {};
  (a.legal_texts || []).concat(a.cross_law || []).forEach(function (t) {
    var k = t.source + '|' + t.article; if (seen[k]) return; seen[k] = 1; refs.push(t);
  });
  if (!refs.length) { box.innerHTML = '<div class="empty small">مفيش مواد مباشرة في الإجابة دي.</div>'; return; }
  box.innerHTML = refs.slice(0, 8).map(function (t, i) {
    return '<div class="ref" style="animation-delay:' + (i * 70) + 'ms" data-r="' + i + '"><h4>' + refChip(t.source, t.article) + '</h4><div class="tx small">' + esc(t.quote || t.note || '') + '</div></div>';
  }).join('');
  refs.slice(0, 8).forEach(function (t, i) {
    api('kb.article', { source: t.source, num: t.article }).then(function (art) {
      var el = $('.ref[data-r="' + i + '"] .tx', box); if (el) el.textContent = art.text;
    }).catch(function () {});
  });
}

var CONF = { explicit: ['نص صريح', 'b-ok'], inferred: ['استنتاج من نصوص عامة', 'b-warn'], needs_lawyer: ['يحتاج مراجعة محامٍ', 'b-bad'] };
var CHECK = { ok: ['الاقتباس مطابق للنص', 'b-ok'], partial: ['مطابق جزئياً', 'b-warn'], mismatch: ['الاقتباس لا يطابق النص', 'b-bad'], missing: ['المادة غير موجودة', 'b-bad'] };

function renderAnswer(r) {
  var a = r.answer, ver = r.verification || { checks: [] };
  var chk = function (s, n, cross) {
    for (var i = 0; i < ver.checks.length; i++) {
      var c = ver.checks[i];
      if (c.source === s && String(c.article) === String(n) && !!c.cross === !!cross) return c;
    }
    return {};
  };
  var conf = CONF[a.confidence] || ['', 'b-info'];
  var h = '<div class="card answer" data-id="' + esc(r.id) + '"><div class="a-head"><div class="row">';
  if (r.provider === 'search') h += '<span class="badge b-info">' + ic('search') + 'وضع البحث فقط</span>';
  else h += '<span class="badge ' + conf[1] + '">' + conf[0] + '</span>';
  h += ver.all_ok ? '<span class="badge b-ok">' + ic('check') + 'كل المراجع اتراجعت</span>'
                  : '<span class="badge b-bad">' + ic('alert') + ver.problems + ' مرجع مش مطابق — راجع قبل الاعتماد</span>';
  if (!a.found) h += '<span class="badge b-warn">لا يوجد نص صريح في المراجع المتاحة</span>';
  h += '</div>';
  if (r.notice) h += '<div class="alert warn">' + ic('info') + '<div>' + esc(r.notice) + '</div></div>';
  if (r.redactions && r.redactions.length) h += '<div class="alert info">' + ic('shield') + '<div>اتحذفت بيانات حساسة من السؤال تلقائياً قبل إرساله.</div></div>';
  h += '<div class="summary">' + esc(a.summary) + '</div></div><div class="a-body">';

  h += '<div class="sec"><div class="sec-t"><span class="n">1</span>النص القانوني والمادة المرجعية</div>';
  if (!(a.legal_texts || []).length) h += '<div class="muted">لم يُعثر على نص مباشر في المراجع المتاحة.</div>';
  (a.legal_texts || []).forEach(function (t) {
    var c = CHECK[chk(t.source, t.article, false).status] || ['', 'b-info'];
    h += '<div class="quote"><div class="meta">' + refChip(t.source, t.article) + '<span class="badge ' + c[1] + '">' + c[0] + '</span></div>' +
         esc(t.quote) + '<div class="why">' + esc(t.relevance) + '</div></div>';
  });
  h += '</div>';
  if (r.provider !== 'search' || a.explanation) h += '<div class="sec"><div class="sec-t"><span class="n">2</span>التفسير المبسط والتطبيقي</div>' + md(a.explanation) + '</div>';
  if (r.provider !== 'search') {
    h += '<div class="sec"><div class="sec-t"><span class="n">3</span>التقاطع مع القوانين الأخرى</div>';
    if (!(a.cross_law || []).length) h += '<div class="muted">لا يوجد في المراجع المتاحة نص مرتبط مباشرة من القوانين الأخرى.</div>';
    (a.cross_law || []).forEach(function (x) {
      var c = chk(x.source, x.article, true);
      h += '<div style="margin-bottom:8px">' + refChip(x.source, x.article) + (c.status === 'missing' ? '<span class="badge b-bad">غير موجودة</span>' : '') + ' ' + esc(x.note) + '</div>';
    });
    h += '</div><div class="sec"><div class="sec-t"><span class="n">4</span>أمثلة عملية</div><div class="examples">' +
      (a.examples || []).map(function (e) {
        return '<div class="example"><h4>' + esc(e.title) + '</h4><div class="small">' + esc(e.scenario) + '</div><div class="out"><b>النتيجة:</b> ' + esc(e.outcome) + '</div></div>';
      }).join('') + '</div></div>';
  }
  if ((a.clarifying_questions || []).length) {
    h += '<div class="sec"><div class="sec-t">' + ic('info') + 'معلومات تحدد الحكم بدقة</div><ul>' +
      a.clarifying_questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
  }
  if ((a.missing_references || []).length) {
    h += '<div class="alert warn">' + ic('alert') + '<div><b>مراجع غير متاحة يحتاجها هذا السؤال:</b><ul style="margin:4px 0 0">' +
      a.missing_references.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div></div>';
  }
  // مخالفة من لائحة الجزاءات في الإجابة ← زر إنشاء المستند مباشرة
  var pen = (a.legal_texts || []).concat(a.cross_law || []).filter(function (t) { return t.source === 'penreg' && /^\d+$/.test(String(t.article)); })[0];
  h += '</div><div class="a-actions">' +
    '<button class="btn ghost sm" data-aa="copy">' + ic('copy') + 'نسخ</button>' +
    '<button class="btn ghost sm" data-aa="wa">' + ic('share') + 'واتساب</button>' +
    '<button class="btn ghost sm" data-aa="print">' + ic('print') + 'PDF</button>' +
    (pen ? '<button class="btn soft sm" data-aa="doc" data-v="' + esc(pen.article) + '">' + ic('file') + 'اعمل قرار الجزاء (مخالفة ' + esc(pen.article) + ')</button>' : '') +
    '<span class="spacer"></span><div class="feedback"><span class="small muted">الإجابة دقيقة؟</span>' +
    '<button class="btn ghost sm" data-fb="good">👍</button><button class="btn ghost sm" data-fb="bad">👎</button></div></div></div>';
  return h;
}

/** نص الإجابة كاملاً (للنسخ والمشاركة). */
function answerText(r) {
  var a = r.answer, t = '❓ ' + r.question + '\n\n✅ ' + a.summary + '\n';
  if ((a.legal_texts || []).length) t += '\n📌 النص القانوني:\n' + a.legal_texts.map(function (x) { return '• ' + (x.source === 'penreg' ? 'مخالفة ' : 'مادة ') + x.article + ' (' + srcShort(x.source) + '): ' + x.quote; }).join('\n') + '\n';
  if (a.explanation) t += '\n📖 التفسير:\n' + a.explanation.replace(/\*\*/g, '') + '\n';
  if ((a.cross_law || []).length) t += '\n🔗 التقاطع مع القوانين الأخرى:\n' + a.cross_law.map(function (x) { return '• ' + srcShort(x.source) + ' م ' + x.article + ': ' + x.note; }).join('\n') + '\n';
  if ((a.examples || []).length) t += '\n💡 أمثلة:\n' + a.examples.map(function (e) { return '• ' + e.title + ': ' + e.scenario + ' ← ' + e.outcome; }).join('\n') + '\n';
  return t + '\n— المستشار القانوني · ' + (window.COMPANY || 'Full Speed');
}
function findAnswer(id) {
  for (var i = 0; i < state.session.length; i++) if (String(state.session[i].id) === String(id)) return state.session[i];
  return state.lastHistory && String(state.lastHistory.id) === String(id) ? state.lastHistory : null;
}

/** محرر المواد: مادة واحدة بالكتابة، أو لصق نص كامل يُقسّم تلقائياً، أو صورة/PDF يُستخرج نصها. */
function articleEditor(src, art, done) {

    } else if (t === 'paste') {

        '<div class="hint">البرنامج يقسّمه تلقائياً حسب عناوين المواد مثل "مادة (5)" أو "المادة الخامسة"، ثم تراجعه قبل الحفظ.</div></div>' +
        '<button class="btn" id="esplit">' + ic('check') + 'تقسيم ومراجعة</button><div id="epv"></div>';
      $('#esplit', m).addEventListener('click', function () {
        var txt = $('#ep', m).value; if (!txt.trim()) return toast('الصق النص أولاً', true);

      });
    } else {

        '<div class="row"><input class="input" id="ef" type="file" accept="image/*,application/pdf" style="flex:1;min-width:200px"><button class="btn" id="eread">' + ic('search') + 'قراءة النص</button></div><div id="epv"></div>';

        $('#epv', m).innerHTML = '<div class="loading-line" style="margin-top:10px"><div class="spin"></div><span id="eprog">جارٍ الرفع...</span></div>';

function readBase64(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onerror = function () { reject(new Error('تعذرت قراءة الملف')); };
    r.onload = function () { resolve(String(r.result).replace(/^data:[^,]*,/, '')); };
    r.readAsDataURL(file);
  });
}

/** يرفع نصاً طويلاً للخادم على أجزاء (كل جزء 80 ألف حرف) ويعيد عدد الأجزاء. */
function uploadChunks(text, action, extra, onProgress) {
  var size = 80000, total = Math.ceil(text.length / size), i = 0;
  return new Promise(function (resolve, reject) {
    (function next() {
      if (i >= total) return resolve(total);
      var payload = Object.assign({ index: i, total: total, chunk: text.substr(i * size, size) }, extra || {});
      api(action, payload).then(function () { i++; if (onProgress) onProgress(i, total); next(); }).catch(reject);
    })();
  });
}

    '<div class="field"><label class="lbl">النموذج</label><select class="input" id="amodel">' +
    MODELS.map(function (m) { return '<option value="' + m[0] + '"' + (ai.model === m[0] ? ' selected' : '') + '>' + m[1] + '</option>'; }).join('') +
    (MODELS.every(function (m) { return m[0] !== ai.model; }) ? '<option selected value="' + esc(ai.model) + '">' + esc(ai.model) + '</option>' : '') +
    '</select></div></div><div class="small muted">المفاتيح تُحفظ في إعدادات السكربت (Script Properties) ولا تظهر لأي مستخدم ولا تُرفع على GitHub.</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="asave">حفظ</button><button class="btn ghost" id="atest">اختبار المفاتيح</button></div><div id="ares"></div></div>';
}
function kpi(label, value) { return '<div class="card kpi"><div class="l">' + esc(label) + '</div><div class="v num">' + esc(value) + '</div></div>'; }

// ---------------- البدء ----------------
if (state.token) {
  api('auth.me').then(function (u) { state.user = u; if (u.company) window.COMPANY = u.company; renderShell(); }).catch(function () { logoutLocal(); });
} else {
  renderAuth();
}
})();
</script>
</body>
</html>
